name: Build BioAR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não foi encontrado em $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # O pipeline precisa aceitar todas as licenças SDK sem interromper
          # o processo quando o comando yes termina após a última pergunta.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build local web assets
        run: npm run build

      - name: Verify offline web bundle
        run: |
          if grep -R -E 'cdn\.tailwindcss\.com|cdnjs\.cloudflare\.com/ajax/libs/three|unpkg\.com/@phosphor-icons/web|fonts\.googleapis\.com' dist; then
            echo 'Uma dependência externa foi encontrada no bundle offline.'
            exit 1
          fi

      - name: Create Android project
        run: npx cap add android

      - name: Sync local assets with Android
        run: npx cap sync android

      - name: Configure offline camera permission
        run: node scripts/prepare-android.mjs

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK permissions
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" > /tmp/bioar-permissions.txt
          cat /tmp/bioar-permissions.txt
          if ! grep -q "android.permission.CAMERA" /tmp/bioar-permissions.txt; then
            echo "A permissão da câmera não foi incluída no APK."
            exit 1
          fi
          if grep -q "android.permission.INTERNET" /tmp/bioar-permissions.txt; then
            echo "O APK ainda declara permissão de internet."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioAR-offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
